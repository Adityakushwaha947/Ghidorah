services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gidorah
      POSTGRES_PASSWORD: gidorah_dev_only
      POSTGRES_DB: gidorah
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gidorah-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gidorah -d gidorah"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  gidorah-postgres:
