name: Fixture and foundation verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gidorah
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: gidorah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gidorah -d gidorah_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GIDORAH_DATABASE_PROFILE: local
      GIDORAH_DATABASE_URL: postgresql://gidorah:fixture_only@127.0.0.1:5432/gidorah_test
      MASTRA_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
